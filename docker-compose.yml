services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voxpilot
      POSTGRES_PASSWORD: voxpilot
      POSTGRES_DB: voxpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxpilot -d voxpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://voxpilot:voxpilot@postgres:5432/voxpilot
      OUTPUT_DIR: /app/outputs
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs

volumes:
  pgdata:
